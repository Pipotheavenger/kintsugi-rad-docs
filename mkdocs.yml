site_name: kintsugi-rad · code map
site_description: How kintsugi-rad works, file by file, with links to the documented code.
repo_url: https://github.com/Pipotheavenger/kintsugi-rad-docs
repo_name: kintsugi-rad-docs
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - scheme: default
      primary: white
      accent: amber
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      primary: black
      accent: amber
      toggle: {icon: material/weather-sunny, name: Light mode}

extra_css:
  - assets/codemap.css

extra_javascript:
  - path: assets/codemap.js
    type: module

hooks:
  - docs/hooks/codemap.py
  - docs/hooks/shape_refs.py

exclude_docs: |
  hooks/
  codemap.yml

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [., scripts]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_if_no_docstring: true
            members_order: source
            heading_level: 2
            docstring_options:
              warn_unknown_params: false
              warn_missing_types: false

nav:
  - Home: index.md
  - Code map: code-map.md
  - Data contract: data-contract.md
  - Model, loss, metrics: model.md
  - Experiments (DAM 1/2/3): experiments.md
  - Hardcoded values: hardcoded.md
  - Limitations: limitations.md
  - API reference:
      - scripts/launcher.py: reference/launcher.md
      - launcher_utils: reference/launcher_utils.md
      - datasets_and_dataloaders: reference/datasets_and_dataloaders.md
      - dataset_utils: reference/dataset_utils.md
      - augmentations: reference/augmentations.md
      - feature_extraction_whisper: reference/feature_extraction_whisper.md
      - base_models: reference/base_models.md
      - losses: reference/losses.md
      - ordinal_thresholding: reference/ordinal_thresholding.md
      - metrics: reference/metrics.md
      - constants: reference/constants.md
      - utils: reference/utils.md
      - plotting: reference/plotting.md
  - Contributing: STYLE.md
