---
experiment_name: "train_head_lr1e4_audio_model_best"
description: "Model with frozen LLMA and frozen audio backbone"

model_params:
  # Set path (absolute or relative to this config file) to a model.py file, or a
  # package patch in kipy (eg. kipy.models.e2e.whisper_ft_model).
  model_path: "model.DepAnxClassifier"
  # this can be wandb URL, for example:
  # "https://entity.wandb.io/entity/project/artifacts/model/model-run-id/best"
  ckpt_path: ""
  restore_training_state: false
  config:
    whisper_config:
      model: "openai/whisper-small.en"
      hf_config:
        encoder_layerdrop: 0.0
        dropout: 0.0
        activation_dropout: 0.0
      lora_params:
        r: 32
        lora_alpha: 64.0
        target_modules: "all-linear"
        lora_dropout: 0.4
        modules_to_save: # LoRA cannot be applied to these modules, but we still want to train them
          - conv1
          - conv2
        bias: "all"
    # this is a placeholder which should be swapped with production-grade LLMA
    llma_ckpt: "<wandb_url_to_llma_model>"
    classifier_config:
      shared_projection_dim:
        - 256
        - 64 # with multiple layers, the last layer acts as the shared matrix B in a low-rank matrix factorization of the task-specific weights W_t = H_t * B
      tasks:
        depression:
          proj_dim: 128
          dropout: 0.4
        anxiety:
          proj_dim: 128
          dropout: 0.4

training_params:
  seed: 46
  batch_size: 1
  effective_batch_size: 4
  max_epochs: 5
  early_stopping_patience: 10
  monitor_loss: "max:metrics/val/sn_eq_sp@0%i" # mode:name (combined in one param to avoid changing them independently)
  training_examples_per_eval: 16000
  scheduler:
    gamma: 0.5
    milestones:
      - 20
      - 26
  optimizer:
    backbone:
      lr: 4.0e-04 # If turning off LoRA, set to 2.0e-6 to achieve competitive results
      weight_decay: 0.001
    classifier:
      lr: 4.0e-04
      weight_decay: 0.001
  tasks:
    depression:
      ordinal_loss_target_type: "exact28" # Literal["exact28", "LvMvH", "LvMH", "LMvH"]
      num_classes: 28
    anxiety:
      ordinal_loss_target_type: "exact22" # Literal["exact22", "{2,3}_vs_{0,1}", "{0}_vs_{1}_vs_{2}_vs_{3}"]
      num_classes: 22

data_params:
  metadata=kirad.datasets_and_dataloaders.KintsugiMetadata:
    train:
      duration_column: "prompt_vad_trimmed_duration"
      audio_root: "~/.kintsugi/audio/resampled_and_trimmed_audio_with_prompt_vad_params"
    val_test:
      duration_column: "prompt_vad_cut_duration"
      audio_root: "~/.kintsugi/audio/resampled_and_cut_audio_with_prompt_vad_params"
    default:
      # Parameters in this section apply to all splits.
      # Parameters specified in split-specific section override the values set here.
      df_or_dataset_version: "v2.11.4"
      data_sources:
        - "phonic"
        - "sonar_general_pop"
        - "sonar_senior_pop"
        - "sonar_elderly_and_latino_pop"
      dataset_fold: 0
      label_column:
        depression: "phq"
        anxiety: "gad"
      fraction: 1.0
  audio=kirad.datasets_and_dataloaders.KintsugiAudioDataset:
    default:
      # Parameters in this section apply to all splits.
      # Parameters specified in split-specific section override the values set here.
      preprocessor: "openai/whisper-small.en"
      window_method: "all"
      normalize_audio: true
      normalize_features: true
      ideal_logmel_energies: "logmel_energies.npy"
      pad_last_chunk_to_full: true
